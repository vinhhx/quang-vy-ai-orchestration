<!doctype html>
<html lang="vi" class="scheme-light dark:scheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>agent-brain</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/js/theme.js"></script>
  <script defer src="/js/app.js"></script>
  <script defer src="/vendor/alpine.csp.min.js"></script>
</head>
<body class="bg-slate-50 text-base font-normal leading-normal text-slate-900 dark:bg-slate-900 dark:text-slate-100" x-data="shell">
  <header class="bg-white ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700">
    <div class="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center gap-4">
      <span class="text-xl font-semibold leading-[1.2]">agent-brain</span>
      <nav aria-label="Điều hướng chính" class="flex flex-wrap gap-2">
        <a href="#/" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('overview')" :aria-current="navCurrent('overview')">Tổng quan</a>
        <a href="#/assign" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('assign')" :aria-current="navCurrent('assign')">Giao việc</a>
        <a href="#/board" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('board')" :aria-current="navCurrent('board')">Bảng công việc</a>
        <a href="#/stats" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('stats')" :aria-current="navCurrent('stats')">Thống kê</a>
        <a href="#/projects" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('projects')" :aria-current="navCurrent('projects')">Dự án</a>
<a href="#/settings" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('settings')" :aria-current="navCurrent('settings')">Cài đặt</a>
      </nav>
      <div class="ml-auto flex flex-wrap items-center gap-4">
        <label for="ab-profile" class="text-sm font-semibold leading-normal">Lọc theo profile</label>
        <select id="ab-profile" x-model="profile" @change="profileChanged" title="Chỉ lọc danh sách và thống kê. Task mới luôn chạy bằng profile của dự án." class="w-auto min-h-12 rounded-xl bg-white px-4 py-2 text-base text-slate-900 ring-1 ring-slate-500 placeholder:text-slate-500 dark:bg-slate-900 dark:text-slate-100 dark:ring-slate-400 dark:placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400">
          <option value="all">Tất cả</option>
          <option value="work">work</option>
          <option value="personal">personal</option>
        </select>
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-xl px-4 py-2 text-base font-semibold text-slate-900 ring-1 ring-slate-300 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 dark:text-slate-100 dark:ring-slate-600 dark:hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" x-text="themeLabel" :aria-label="themeAria" @click="toggleTheme"></button>
      </div>
    </div>
  </header>
  <div class="max-w-6xl mx-auto px-6 pt-6 space-y-4" x-show="hasBanner">
    <div role="alert" x-show="sessionLost" class="rounded-xl bg-rose-50 p-4 ring-1 ring-rose-300 text-rose-900 dark:bg-rose-900/20 dark:ring-rose-700 dark:text-rose-200">Phiên đã hết hạn. Mở lại URL có token đã in ở terminal đang chạy agent-brain serve.</div>
    <div role="alert" x-show="connLost" class="rounded-xl bg-amber-50 p-4 ring-1 ring-amber-300 text-amber-900 dark:bg-amber-900/20 dark:ring-amber-700 dark:text-amber-200">Mất kết nối tới agent-brain serve. Kiểm tra terminal đang chạy serve; trang sẽ tự kết nối lại.</div>
  </div>
  <main id="screen" tabindex="-1" class="max-w-6xl mx-auto px-6 py-8 focus:outline-none"></main>
</body>
</html>
