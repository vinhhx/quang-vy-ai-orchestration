<!doctype html>
<html lang="vi" class="scheme-light dark:scheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>agent-brain</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/js/theme.js"></script>
  <script defer src="/js/app.js"></script>
  <script defer src="/vendor/alpine.csp.min.js"></script>
</head>
<body class="bg-slate-50 text-base font-normal leading-normal text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen md:flex" x-data="shell">
  <aside class="flex flex-col gap-4 bg-white p-4 ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700 md:sticky md:top-0 md:h-screen md:w-64 md:shrink-0 md:self-start md:overflow-y-auto md:border-r md:border-slate-200 md:ring-0 dark:md:border-slate-700">
      <span class="text-xl font-semibold leading-[1.2]">agent-brain</span>
      <nav aria-label="Điều hướng chính" class="flex flex-wrap gap-2 md:flex-col md:gap-1">
        <a href="#/queue" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('queue')" :aria-current="navCurrent('queue')">Điều phối</a>
        <a href="#/board" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('board')" :aria-current="navCurrent('board')">Bảng công việc</a>
        <a href="#/stats" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('stats')" :aria-current="navCurrent('stats')">Thống kê</a>
        <a href="#/projects" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('projects')" :aria-current="navCurrent('projects')">Dự án</a>
<a href="#/settings" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('settings')" :aria-current="navCurrent('settings')">Cài đặt</a>
        <a href="#/telegram" class="rounded-xl px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" :class="navClass('telegram')" :aria-current="navCurrent('telegram')">Telegram</a>
      </nav>
      <div class="flex flex-col gap-3 md:mt-auto">
        <label for="ab-profile" class="text-sm font-semibold leading-normal">Lọc theo profile</label>
        <select id="ab-profile" x-model="profile" @change="profileChanged" title="Chỉ lọc danh sách và thống kê. Task mới luôn chạy bằng profile của dự án." class="w-full min-h-12 rounded-xl bg-white px-4 py-2 text-base text-slate-900 ring-1 ring-slate-500 placeholder:text-slate-500 dark:bg-slate-900 dark:text-slate-100 dark:ring-slate-400 dark:placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400">
          <option value="all">Tất cả</option>
          <option value="work">work</option>
          <option value="personal">personal</option>
        </select>
        <button type="button" class="inline-flex w-full min-h-12 items-center justify-center gap-2 rounded-xl px-4 py-2 text-base font-semibold text-slate-900 ring-1 ring-slate-300 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 dark:text-slate-100 dark:ring-slate-600 dark:hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400" x-text="themeLabel" :aria-label="themeAria" @click="toggleTheme"></button>
      </div>
  </aside>
  <div class="min-w-0 flex-1">
  <div class="px-6 pt-6 space-y-4" x-show="hasBanner">
    <div role="alert" x-show="sessionLost" class="rounded-xl bg-rose-50 p-4 ring-1 ring-rose-300 text-rose-900 dark:bg-rose-900/20 dark:ring-rose-700 dark:text-rose-200">Phiên đã hết hạn. Mở lại URL có token đã in ở terminal đang chạy agent-brain serve.</div>
    <div role="alert" x-show="connLost" class="rounded-xl bg-amber-50 p-4 ring-1 ring-amber-300 text-amber-900 dark:bg-amber-900/20 dark:ring-amber-700 dark:text-amber-200">Mất kết nối tới agent-brain serve. Kiểm tra terminal đang chạy serve; trang sẽ tự kết nối lại.</div>
  </div>
  <main id="screen" tabindex="-1" class="px-6 py-8 focus:outline-none"></main>
  </div>

  <!-- Modal popup dùng chung cho Tổng quan và Giao việc -->
  <div id="ab-screen-modal" role="dialog" aria-modal="true" aria-labelledby="ab-modal-title" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-0 sm:p-4 md:p-6 backdrop-blur-xs">
    <div id="ab-modal-panel" class="flex flex-col w-full h-full sm:h-auto sm:max-h-[90vh] sm:max-w-5xl rounded-none sm:rounded-2xl bg-white shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700 overflow-hidden">
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-800">
        <h2 id="ab-modal-title" class="text-xl font-semibold leading-[1.2] text-slate-900 dark:text-slate-100">Tiêu đề</h2>
        <button id="ab-modal-close" type="button" aria-label="Đóng hộp thoại" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400">
          <span aria-hidden="true" class="text-2xl leading-none">&times;</span>
        </button>
      </div>
      <div id="ab-modal-body" class="flex-1 overflow-y-auto px-6 py-6"></div>
    </div>
  </div>
</body>
</html>
